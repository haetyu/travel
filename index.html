/* Navy ticket-style cover and subtle waypoint marks. */
:root {
  --ink: #142844;
  --secondary-ink: #4e6480;
  --line: #dbe4ef;
  --paper-blue: #f0f4f9;
}
body { background: #f5f7fa; }
.hero {
  background: radial-gradient(ellipse at 77% 14%, #314e72 0, #1d3658 44%, #132844 80%);
  min-height: 195px;
  border: 1px solid #1d3453;
  box-shadow: 0 11px 22px #192d4716;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid #b7c8e635;
  border-radius: 9px;
  pointer-events: none;
}
.heroText { padding: 8px 13px 12px 0; }
.heroText small {
  width: max-content;
  border: 1px solid #a9bcda66;
  padding: 4px 9px;
  border-radius: 4px;
}
.hero-perforation {
  position: absolute;
  height: 1px;
  bottom: 1px;
  left: 0;
  right: 15%;
  border-bottom: 1px dashed #b7c8e666;
}
#sky { width: 58%; }
.days button {
  background: #fff;
  box-shadow: 0 2px 4px #192d4708;
}
.days button.on {
  background: linear-gradient(145deg,#1a2f4c,#2b466a);
  box-shadow: inset 0 3px #8ea7ca,0 4px 10px #213b5b24;
}
.panel { box-shadow: 0 3px 12px #192d4708; }
.event { padding: 7px 0; }
.event .bubble { background: #eef3fa; border-color: #d7e2f0; }
.event.done .bubble { background: #243c5e; }
.gate-card {
  border-top: 4px solid #2d4668;
  outline: 1px dashed #d1dce9;
  outline-offset: -10px;
}
.gate-icon { box-shadow: 0 0 0 4px #e9eff7; }
.estimated-panel { border-top: 3px solid #466187; }
.estimate-chip {
  display: inline-flex; align-items: center; gap: 5px;
  margin-top: 4px; padding: 2px 6px; border-radius: 4px;
  color: var(--ink); background: var(--paper-blue); font-size: 13px;
}
.estimate-chip .ico { width: 14px; height: 14px; flex: 0 0 14px; }
.fx-value { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 6px; }
.fx-value > span { white-space: nowrap; }
.fx-won { font-size: .83em; font-weight: 550; color: var(--secondary-ink); }
.money .fx-value, .expense-row .fx-value {
  display: flex; flex-direction: column; gap: 0; align-items: flex-start;
}
.money .fx-won, .expense-row .fx-won { font-size: 13px; line-height: 1.4; letter-spacing: 0; }
.expense-row .fx-value { align-items: flex-end; }
.row > strong, .row > b { text-align: right; }
.allocation > b { display: flex; align-items: flex-start; gap: 5px; }
.allocation .fx-value { flex-direction: column; gap: 0; }
.allocation-slash { color: #647a95; }
.rate { color: var(--secondary-ink); font-size: 13px; }
.rate b { color: var(--ink); margin-right: 5px; }
.exchange-strip {
  display: flex; align-items: center; gap: 7px;
  color: #476489; padding: 7px 10px; margin: 0 0 12px;
  width: fit-content; background: var(--paper-blue); border: 1px solid var(--line); border-radius: 6px;
}
.exchange-strip .ico { width: 17px; height: 17px; }
.estimate-summary .row { margin: 7px 0 0; }
.money-preview { background: var(--paper-blue); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-top: 14px; }
.money-preview .row { margin: 4px 0; gap: 8px; }
.money-preview .rate, .estimated-panel .rate { display: block; margin-top: 7px; }
@media(max-width:800px) {
  .hero { min-height: 166px; }
  .money .fx-won { font-size: 12px; }
}
@media(max-width:440px) {
  .heroText { background: linear-gradient(90deg,#172d4cf0 70%,transparent); }
  #sky { width: 67%; right: -5%; opacity: .7; }
  .budget-stats .money { font-size: clamp(14px,4.3vw,20px); }
  .expense-row .fx-won { font-size: 12px; }
}

  </style>
</head>
<body>
  <section id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-icon" data-i="lock"></div>
      <h1>여행 수첩</h1>
      <p class="muted" id="gate-hint">이 화면이 그대로라면 파일을 다운로드하고 Chrome·Edge·Safari에서 직접 열어주세요.</p>
      <form id="unlock" autocomplete="off">
        <label for="password">접속 코드</label>
        <div class="password-row">
          <input id="password" type="password" required spellcheck="false" enterkeyhint="go" autocapitalize="none">
          <button type="button" id="show-password" aria-label="접속 코드 표시" data-i="eye"></button>
        </div>
        <p id="gate-error" class="error" role="alert"></p>
        <button type="submit" class="primary full" id="open-book" disabled>수첩 열기</button>
      </form>
    </div>
  </section>
  <div id="app" hidden>
    <aside>
      <div class="brand"><i data-i="book"></i> 여행 수첩</div>
      <nav id="nav" aria-label="수첩 메뉴"></nav>
      <button class="private" type="button" data-action="lock"><i data-i="lock"></i> 잠그기</button>
    </aside>
    <main>
      <header>
        <span>내 여행 <b>/</b> <span id="location-name"></span></span>
        <button type="button" class="edit" data-action="lock" id="mobile-lock"><i data-i="lock"></i> 잠그기</button>
        <span class="timezone">일본 표준시 · JST</span>
      </header>
      <section class="hero">
        <div class="heroText">
          <small><span class="flag"></span><span id="country-name"></span></small>
          <h1 id="trip-heading"></h1>
          <p id="trip-dates"></p>
          <span class="hero-perforation" aria-hidden="true"></span>
        </div>
        <svg id="sky" viewBox="0 0 530 180" aria-hidden="true">
          
          <defs>
            <pattern id="wave" width="36" height="18" patternUnits="userSpaceOnUse">
              <path d="M0 18a18 18 0 0 1 36 0M4 18a14 14 0 0 1 28 0M8 18a10 10 0 0 1 20 0" fill="none" stroke="#aac0df" stroke-width=".65"/>
            </pattern>
          </defs>
          <path d="M200 145H530V180H200Z" fill="url(#wave)" opacity=".28"/>
          <circle cx="396" cy="65" r="48" fill="#c0d0e6" opacity=".12"/>
          <circle cx="396" cy="65" r="56" fill="none" stroke="#b1c7e5" opacity=".28"/>
          <path d="M276 72h55m-41-6h29m141 1h43m-33-6h42M346 128h28" fill="none" stroke="#a5bedc" opacity=".47"/>
          <path d="m164 100 17-11 17 12-9-2-6 5-8-6-11 2Z" fill="#d9e5f5" opacity=".72"/>
          <path d="M231 73h24m-12-12v24m-7-19 14 14m0-14-14 14" fill="none" stroke="#d6e3f3" opacity=".48"/>
          <path d="M476 37h12m-6-6v12m-16 14h5m-2.5-2.5v5" fill="none" stroke="#e0ebf8" opacity=".6"/>
          <path d="M7 168 77 134l30 6 74-51 35 22 58 47m-253 10h507" fill="none" stroke="currentColor" stroke-width="1" opacity=".42"/>
          <path d="M290 168v-67h33v67m10 0v-42h31v42m92 0v-56h32v56m8 0v-84h29v84m-252 0v-37h-27v37" fill="none" stroke="currentColor" opacity=".42"/>
          <path d="M377 168l22-55 13-78 12 78 22 55m-54-55h39m-35 12h32m-43 17h53m-26-107V14m-21 128 34-17m-1 17-26-17m-57 43 27-26m45 0 23 26" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M51 168v-26m46 26v-26m-56 0h67m-69-9q35 6 72 0m4-2q-3 10-29 9m-48-9q3 10 29 9m-14 11h44" fill="none" stroke="currentColor" stroke-width="2" opacity=".72"/>
        </svg>
      </section>
      <div id="content"></div>
      <footer><span id="status" role="status"></span><button class="edit" type="button" data-action="backup"><i data-i="download"></i> 잠금 백업</button></footer>
    </main>
  </div>
  <dialog id="modal">
    <form id="editor">
      <div class="dialoghead"><h2 id="editor-title"></h2><button type="button" id="close" aria-label="닫기">×</button></div>
      <div id="fields"></div>
      <div id="money-preview" class="money-preview" aria-live="polite" hidden></div>
      <p id="error" class="error" role="alert"></p>
      <div class="editor-actions"><button type="button" class="danger" id="remove" hidden>삭제</button><button class="primary" id="save">저장</button></div>

  const icon = (name) => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.pin}</svg>`;
  document.querySelectorAll('[data-i]').forEach((el) => { el.innerHTML = icon(el.dataset.i); });
  const escape = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  function newId() {
    return Array.from(crypto.getRandomValues(new Uint8Array(16)), (byte) =>
      byte.toString(16).padStart(2, '0')).join('');
  }

  const categories = ['교통', '식비', '쇼핑', '입장·게임', '숙박', '기타'];
  const periods = [['새벽', '00:00–05:59', 0, 6], ['오전', '06:00–11:59', 6, 12], ['오후', '12:00–17:59', 12, 18], ['저녁', '18:00–23:59', 18, 24]];
  const eventTypes = [['pin','방문'], ['plane','항공'], ['train','교통'], ['hotel','숙소'], ['bag','쇼핑'], ['food','식사'], ['game','게임'], ['ticket','입장']];
  const sections = [['plan','calendar','계획'], ['budget','wallet','예산'], ['route','route','코스']];
  const allowedStatuses = ['계획', '확정', '예상', '목표', '확인', '선택'];
  const payload = JSON.parse($('trip-payload').textContent);
  const cacheKey = 'travel-book:' + payload.salt + ':' + (payload.copy || 'original') + ':' + location.pathname;
  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  const decode64 = (str) => Uint8Array.from(atob(str), (char) => char.charCodeAt(0));
  const encode64 = (bytes) => btoa(Array.from(bytes, (byte) => String.fromCharCode(byte)).join(''));
  let key = null;
  let state = null;
  let page = 'plan';
  let day = 0;
  let filter = 'all';
  let editor = null;
  let diskSnapshot = null;
  let saving = false;
  let canStore = true;

  async function getKey(password) {
    const material = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({
      name: 'PBKDF2', salt: decode64(payload.salt), iterations: 600000, hash: 'SHA-256',
    }, material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  async function decrypt(record, accessKey) {
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode64(record.iv) }, accessKey, decode64(record.ct));
    const result = JSON.parse(decoder.decode(plaintext));
    if (result.version !== 1 || result.days.length !== 4) throw new Error('Invalid data');
    return result;
  }

  async function encrypt(data) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoder.encode(JSON.stringify(data)));
    return { salt: payload.salt, iv: encode64(iv), ct: encode64(new Uint8Array(cipher)) };
  }

  const yenFmt = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' });
  const yen = (value) => yenFmt.format(value);
  const wonPer100Yen = 830;
  const wonFmt = new Intl.NumberFormat('ko-KR');
  const won = (value) => {
    const amount = Math.round(Math.abs(value) * wonPer100Yen / 100);
    return (value < 0 ? '−' : '') + wonFmt.format(amount) + '원';
  };
  const money = (value) => `<span class="fx-value"><span>${yen(value)}</span><span class="fx-won">약 ${won(value)}</span></span>`;
  const rate = () => `<span class="rate"><b>환산 기준</b> 100엔 = ${wonFmt.format(wonPer100Yen)}원</span>`;
  const isoDate = (index) => {
    const date = new Date(state.startDate + 'T00:00:00Z');
    date.setUTCDate(date.getUTCDate() + index);
    return date.toISOString().slice(0, 10);
  };
  const dayLabel = (index) => `${state.days[index][0]} (${state.days[index][1]})`;
  const sum = (numbers) => numbers.reduce((total, value) => total + value, 0);
  const totalSpend = () => sum(state.expenses.map((entry) => entry.amount));
  const allocated = () => sum(Object.values(state.budget));
  const planned = (items, skipId) => sum(items.filter((event) => event.id !== skipId).map((event) => event.estimate ?? 0));
  const allEvents = () => state.days.flatMap((entry) => entry[3]);
  const remaining = (amount) => state.total
    ? `<span class="${amount > state.total ? 'over' : ''}">${money(state.total - amount)}</span>`
    : '<span class="muted">미설정</span>';
  const spend = (entries, category) => sum(entries.filter((entry) => !category || entry.category === category).map((entry) => entry.amount));
  const events = () => [...state.days[day][3]].sort((a,b) => a.time.localeCompare(b.time));
  function checkpoints() {
    const stops = [];
    for (const event of events()) {
      if (event.place && event.place !== stops[stops.length - 1]?.place) stops.push(event);
    }
    return stops;
  }
  const button = (label, glyph, action, id = '', classes = '') => `<button type="button" class="${classes}" data-action="${action}" data-id="${id}">${glyph ? icon(glyph) : ''} ${label}</button>`;
  const iconButton = (label, glyph, action, id) => `<button type="button" class="edit" data-action="${action}" data-id="${id}" aria-label="${label}" title="${label}">${icon(glyph)}</button>`;
  const mapLink = (label, quote) => `<a href="${escape(quote)}" target="_blank" rel="noopener noreferrer">${icon('pin')} ${label}</a>`;
  const mapURL = (target, previous) => {
    const params = new URLSearchParams({ api: '1' });
    if (!previous) {
      params.set('query', target.place);
      return 'https://www.google.com/maps/search/?' + params;
    }
    params.set('origin', previous.place);
    params.set('destination', target.place);
    params.set('travelmode', !target.mode || /도보|건물|같은/.test(target.mode) ? 'walking' : 'transit');
    return 'https://www.google.com/maps/dir/?' + params;
  };
  const bar = (numerator, denominator) => {
    const percent = denominator ? Math.min(100, 100 * numerator / denominator) : (numerator ? 100 : 0);
    return `<div class="bar" role="progressbar" aria-label="예산 사용률" aria-valuenow="${Math.round(percent)}" aria-valuemin="0" aria-valuemax="100"><b style="width:${percent}%"></b></div>`;
  };

  function tabs() {
    return `<div class="days" aria-label="여행 날짜">${state.days.map(([date, weekday, title], index) => `
      <button type="button" class="${index === day ? 'on' : ''}" aria-pressed="${index === day}" data-action="day" data-id="${index}">
        <small>${weekday}요일</small><strong>${date}</strong><span>${escape(title)}</span>
      </button>`).join('')}</div>`;
  }

  function plan() {
    const sorted = events();
    const todaySpend = spend(state.expenses.filter((entry) => entry.date === isoDate(day)));
    const stops = checkpoints();
    const dayEstimate = planned(sorted);
    const tripEstimate = planned(allEvents());
    return `
      <div class="sectionhead"><h2>여행 계획</h2>${button('일정 추가', 'plus', 'newEvent', '', 'compact primary')}</div>
      ${tabs()}
      <div class="layout">
        <section class="panel">
          <div class="head"><h3>${dayLabel(day)} · ${escape(state.days[day][2])}</h3><span class="muted">${sorted.filter((event) => event.done).length}/${sorted.length} 완료</span></div>
          ${sorted.map((event) => `<div class="event ${event.done ? 'done' : ''}">
            <span class="time">${escape(event.time)}</span><i class="bubble">${icon(event.done ? 'check' : event.type)}</i>
            <div><div class="main-label"><strong>${escape(event.title)}</strong>${event.status !== '계획' ? `<span class="tag ${event.status === '확정' ? 'confirmed' : ''}">${escape(event.status)}</span>` : ''}</div><small>${escape(event.note)}</small>
            ${event.estimate !== undefined && event.estimate !== null ? `<span class="estimate-chip">${icon('wallet')} 예상 ${money(event.estimate)}</span>` : ''}
            </div>
            <div class="actions">${iconButton('완료 상태 전환', 'check', 'toggleEvent', event.id)}${iconButton('일정 수정', 'edit', 'editEvent', event.id)}</div>
          </div>`).join('') || '<p class="empty">일정을 추가해 주세요.</p>'}
        </section>
        <div>
          <section class="panel estimated-panel">
            <h3>${icon('calendar')} 일정 예상 비용</h3>
            <div class="row"><span>선택한 날짜</span><strong>${money(dayEstimate)}</strong></div>
            <div class="row"><span>여행 전체</span><strong>${money(tripEstimate)}</strong></div>
            <div class="row"><span>예상 비용 반영 후</span><strong>${remaining(tripEstimate)}</strong></div>
            ${rate()}
          </section>
          <section class="panel"><h3>${icon('wallet')} 선택한 날짜 지출</h3><div class="money">${money(todaySpend)}</div>
            <div class="row"><span>여행 전체 지출</span><strong>${money(totalSpend())}</strong></div>
            ${bar(totalSpend(), state.total)}<div class="row"><span>전체 예산</span><strong>${state.total ? money(state.total) : '미설정'}</strong></div>
            ${button('지출 기록', 'plus', 'newExpense', '', 'full')}
          </section>
          <section class="panel"><h3>${icon('route')} 오늘 코스</h3>
            ${stops.slice(0, 4).map((event) => `<div class="routeItem"><i>${icon(event.type)}</i><span>${escape(event.title)}</span></div>`).join('')}
            ${button('전체 코스 보기', 'route', 'page', 'route', 'full')}
          </section>
        </div>
      </div>`;
  }

  function budget() {
    const overall = totalSpend();
    const reserved = allocated();
    const tripEstimate = planned(allEvents());
    const entries = state.expenses
      .filter((entry) => filter === 'all' || entry.date === isoDate(Number(filter)))
      .sort((a,b) => (b.date + b.time).localeCompare(a.date + a.time));
    return `
      <div class="sectionhead"><h2>여행 예산</h2><div class="actions">
        ${button('예산 배분', 'wallet', 'editBudget')}${button('지출 기록', 'plus', 'newExpense', '', 'primary')}
      </div></div>
      <div class="exchange-strip">${icon('wallet')} ${rate()}</div>
      <div class="summary budget-stats">
        <div class="panel"><span class="muted">전체 예산</span><div class="money">${state.total ? money(state.total) : '미설정'}</div></div>
        <div class="panel"><span class="muted">전체 지출</span><div class="money">${money(overall)}</div></div>
        <div class="panel"><span class="muted">남은 예산</span><div class="money ${state.total && overall > state.total ? 'over' : ''}">${state.total ? money(state.total - overall) : '—'}</div></div>
      </div>
      <div class="panel estimate-summary">
        <h3>${icon('calendar')} 일정 예상 비용</h3>
        <div class="row"><span>여행 전체 예상</span><strong>${money(tripEstimate)}</strong></div>
        <div class="row"><span>예상 비용 반영 후</span><strong>${remaining(tripEstimate)}</strong></div>
      </div>
      <div class="layout">
        <section class="panel">
          <div class="budget-filter"><h3>${icon('wallet')} 지출 내역</h3><select id="budget-filter" aria-label="지출 조회 날짜">
            <option value="all">전체 기간</option>
            ${state.days.map((_, index) => `<option value="${index}" ${String(index) === filter ? 'selected' : ''}>${dayLabel(index)}</option>`).join('')}
          </select></div>
          <div class="row"><span>선택 기간 합계</span><strong>${money(spend(entries))}</strong></div>
          ${entries.map((entry) => `<div class="expense-row">
            <div><strong>${escape(entry.title)}</strong><small>${entry.date.slice(5).replace('-', '.')} · ${escape(entry.time)} · ${escape(entry.category)}</small></div>
            <div class="actions"><b class="amount">${money(entry.amount)}</b>${iconButton('지출 수정', 'edit', 'editExpense', entry.id)}</div>
          </div>`).join('') || '<p class="empty">아직 기록된 지출이 없어요.</p>'}
        </section>
        <div>
          <section class="panel"><h3>${icon('calendar')} 시간대별 지출</h3>
            ${periods.map(([label, hours, start, end]) => {
              const amount = spend(entries.filter((entry) => {
                const hour = Number(entry.time.slice(0,2));
                return hour >= start && hour < end;
              }));
              return `<div class="row"><span>${label} <small>${hours}</small></span><strong>${money(amount)}</strong></div>${bar(amount, spend(entries))}`;
            }).join('')}
          </section>
          <section class="panel"><h3>${icon('wallet')} 항목별 배분 · 전체 기간</h3>
            <div class="row"><span>미배분 예산</span><b>${state.total ? money(state.total - reserved) : '—'}</b></div>
            ${categories.map((category) => {
              const amount = spend(state.expenses, category);
              const limit = state.budget[category] || 0;
              return `<div class="allocation row"><span>${category}</span><b class="${limit && amount > limit ? 'over' : ''}">${money(amount)} <span class="allocation-slash">/</span> ${money(limit)}</b>${bar(amount, limit)}</div>`;
            }).join('')}
          </section>
        </div>
      </div>`;
  }

  function route() {
    const stops = checkpoints();
    return `
      <div class="sectionhead"><h2>이동 코스</h2></div>${tabs()}
      <div class="panel">
        <div class="head"><h3>${icon('route')} ${dayLabel(day)} · ${escape(state.days[day][2])}</h3></div>
        <p class="subtext">장소가 입력된 일정이 시간순으로 표시돼요.</p>
        ${stops.map((event, index) => {
          const prev = stops[index - 1];
          return `<div class="route-place"><i class="bubble">${icon(event.type)}</i><div>
            <strong>${escape(event.time)} · ${escape(event.title)}</strong>
            ${prev ? `<small>${escape(prev.title)} 출발${event.mode ? ' · ' + escape(event.mode) : ''}</small>` : ''}
            ${event.note ? `<small>${escape(event.note)}</small>` : ''}
            <div class="route-links">${prev ? mapLink('구글 지도 길찾기', mapURL(event, prev)) : ''}${mapLink('장소 보기', mapURL(event))}</div>
          </div></div>`;
        }).join('') || '<p class="empty">계획에서 장소를 추가해 주세요.</p>'}
      </div>`;
  }

  function render() {
    $('location-name').textContent = state.location;
    $('country-name').textContent = state.country;
    $('trip-heading').innerHTML = escape(state.location) + ' 여행<span lang="ja">' + escape(state.kanji) + '</span>';
    $('trip-dates').innerHTML = isoDate(0).replaceAll('-', '.') + ' ' + state.days[0][1]
      + ' — ' + state.days.at(-1)[0] + ' ' + state.days.at(-1)[1] + ' <em>3박 4일</em>';
    $('nav').innerHTML = sections.map(([id, glyph, label]) =>
      `<button type="button" class="${page === id ? 'on' : ''}" ${page === id ? 'aria-current="page"' : ''} data-action="page" data-id="${id}">${icon(glyph)} ${label}</button>`
    ).join('');
    $('content').innerHTML = { plan, budget, route }[page]();
    $('budget-filter')?.addEventListener('change', (event) => {
      filter = event.target.value;
      render();
      $('budget-filter').focus();
    });
  }

  function input(name, label, value, type = 'text', attributes = '') {
    return `<label><span>${label}</span><input name="${name}" type="${type}" value="${escape(value)}" ${attributes}></label>`;
  }

  function select(name, label, options, value) {
    return `<label><span>${label}</span><select name="${name}">${options.map(([id, title]) =>
      `<option value="${escape(id)}" ${value === id ? 'selected' : ''}>${escape(title)}</option>`
    ).join('')}</select></label>`;
  }

  function openEditor(kind, id) {
    const entry = kind === 'event' ? events().find((item) => item.id === id) : state.expenses.find((item) => item.id === id);
    editor = { kind, entry };
    $('editor-title').textContent = kind === 'budget' ? '예산 배분' : (kind === 'event' ? '일정' : '지출') + (entry ? ' 수정' : ' 추가');
    $('error').textContent = '';
    $('remove').hidden = !entry;
    const dayOptions = state.days.map((_, index) => [isoDate(index), dayLabel(index)]);
    const moneyInput = 'min="0" max="100000000" step="1" inputmode="numeric"';
    const currentTime = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute:'2-digit', hourCycle: 'h23' }).format();
    if (kind === 'budget') {
      $('fields').innerHTML = input('total', '전체 예산 (¥)', state.total || '', 'number', moneyInput)
        + '<div class="form-pair">' + categories.map((category, index) =>
          input('cat' + index, category + ' (¥)', state.budget[category] || '', 'number', moneyInput)).join('') + '</div>';
    } else if (kind === 'expense') {
      $('fields').innerHTML = `<div class="form-pair">${select('date', '날짜', dayOptions, entry?.date || isoDate(page === 'budget' && filter !== 'all' ? Number(filter) : day))}${input('time','시간 (JST)', entry?.time || currentTime,'time','required')}</div>`
        + input('title','사용처 / 내용',entry?.title,'text','maxlength="100" required')
        + `<div class="form-pair">${select('category','항목',categories.map((c) => [c,c]),entry?.category)}${input('amount','사용 금액 (¥)',entry?.amount,'number','required min="1" max="100000000" step="1" inputmode="numeric"')}</div>`;
    } else {
      $('fields').innerHTML = `<div class="form-pair">${select('date','날짜',dayOptions,isoDate(day))}${input('time','시간 (JST)',entry?.time || '12:00','time','required')}</div>`
        + `<div class="form-pair">${input('title','일정 이름',entry?.title,'text','maxlength="100" required')}${input('estimate','예상 비용 (¥)',entry?.estimate,'number',moneyInput + ' placeholder="선택 입력"')}</div>`
        + `<div class="form-pair">${select('type','종류',eventTypes,entry?.type)}${select('status','상태',allowedStatuses.map((value) => [value,value]),entry?.status)}</div>`
        + input('place','지도에 검색할 장소 또는 주소',entry?.place,'text','maxlength="160"')
        + input('mode','이전 장소에서 오는 방법',entry?.mode,'text','maxlength="120" placeholder="예: 도보, JR 야마노테선"')
        + input('note','메모',entry?.note,'text','maxlength="200"');
    }
    updateMoneyPreview();
    $('modal').showModal();
  }

  function updateMoneyPreview() {
    if (!editor) return;
    const { kind, entry } = editor;
    const values = Object.fromEntries(new FormData($('editor')));
    const preview = $('money-preview');
    const pairs = [];
    if (kind === 'event') {
      const estimate = Number(values.estimate) || 0;
      const selectedDay = state.days.findIndex((_, index) => isoDate(index) === values.date);
      if (selectedDay < 0) return;
      const dateTotal = planned(state.days[selectedDay][3], entry?.id) + estimate;
      const wholeTrip = planned(allEvents(), entry?.id) + estimate;
      pairs.push(['이 일정 예상 비용', money(estimate)], ['선택한 날짜 예상 합계', money(dateTotal)],
        ['여행 전체 예상 합계', money(wholeTrip)]);
      if (state.total) pairs.push(['예상 비용 반영 후', remaining(wholeTrip)]);
    } else if (kind === 'expense') {
      pairs.push(['지출 원화 환산', money(Number(values.amount) || 0)]);
    } else {
      const total = Number(values.total) || 0;
      const reserved = sum(categories.map((_, index) => Number(values['cat' + index]) || 0));
      pairs.push(['전체 예산', money(total)], ['미배분 예산', money(total - reserved)]);
    }
    preview.hidden = false;
    preview.innerHTML = pairs.map(([label, value]) =>
      `<div class="row"><span>${label}</span><strong>${value}</strong></div>`).join('') + rate();
  }

  $('editor').addEventListener('input', updateMoneyPreview);
  $('editor').addEventListener('change', updateMoneyPreview);

  async function commit(next) {
    if (saving) throw new Error('기록을 저장 중이에요. 잠시 후 다시 시도해 주세요.');
    saving = true;
    try {
      const record = JSON.stringify(await encrypt(next));
      if (canStore) {
        let onDisk;
        try {
          onDisk = localStorage.getItem(cacheKey);
        } catch {
          canStore = false;
        }
        if (canStore && onDisk !== diskSnapshot) {
          throw new Error('다른 탭에서 기록이 변경됐어요. 페이지를 새로 열어주세요.');
        }
      }
      if (canStore) {
        try {
          localStorage.setItem(cacheKey, record);
          diskSnapshot = record;
        } catch {
          canStore = false;
        }
      }
      state = next;
      showSaveStatus();
    } finally {
      saving = false;
    }
  }

  function showSaveStatus() {
    $('status').textContent = canStore
      ? '이 브라우저에 저장됨'
      : '자동 저장을 사용할 수 없어요. 닫기 전에 잠금 백업을 내려받아 주세요.';
  }

  function replaceEntry(entries, entry, next) {
    const others = entry ? entries.filter(({ id }) => id !== entry.id) : entries;
    return [...others, next];
  }

  $('editor').addEventListener('submit', async (event) => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(event.target));
    const { kind, entry } = editor;
    const next = structuredClone(state);
    let nextDay = day;
    $('save').disabled = true;
    $('remove').disabled = true;
    $('close').disabled = true;
    $('error').textContent = '';
    try {
      if (kind === 'budget') {
        next.total = Number(values.total);
        next.budget = Object.fromEntries(categories.map((c, index) => [c, Number(values['cat' + index])]));
        if (sum(Object.values(next.budget)) > next.total) throw new Error('항목별 배분 합계가 전체 예산을 넘어요.');
      } else {
        values.title = values.title.trim();
        if (!values.title) throw new Error('이름을 입력해 주세요.');
        const id = entry?.id || newId();
        if (kind === 'expense') {
          next.expenses = replaceEntry(next.expenses, entry, { ...values, id, amount: Number(values.amount) });
        } else {
          const { date, estimate, ...data } = values;
          nextDay = next.days.findIndex((_, index) => isoDate(index) === date);
          if (entry) next.days[day][3] = next.days[day][3].filter((item) => item.id !== id);
          const plannedCost = estimate === '' || estimate === undefined ? null : Number(estimate);
          if (plannedCost !== null && (!Number.isSafeInteger(plannedCost) || plannedCost < 0 || plannedCost > 100000000)) {
            throw new Error('예상 비용을 0 이상의 엔화 정수로 입력해 주세요.');
          }
          next.days[nextDay][3].push({
            ...data, estimate: plannedCost, place: data.place.trim(), id, done: entry?.done || false,
          });
        }
      }
      await commit(next);
      day = nextDay;
      $('modal').close();
      render();
    } catch (error) {
      $('error').textContent = error.message;
    } finally {
      $('save').disabled = false;
      $('remove').disabled = false;
      $('close').disabled = false;
    }
  });

  $('remove').addEventListener('click', async () => {
    const { kind, entry } = editor;
    if (!entry || !confirm(`‘${entry.title}’ 항목을 삭제할까요?`)) return;
    const next = structuredClone(state);
    if (kind === 'event') next.days[day][3] = next.days[day][3].filter((item) => item.id !== entry.id);
    else next.expenses = next.expenses.filter((item) => item.id !== entry.id);
    $('remove').disabled = true;
    $('save').disabled = true;
    try {
      await commit(next);
      $('modal').close();
      render();
    } catch (error) {
      $('error').textContent = error.message;
    } finally {
      $('remove').disabled = false;
      $('save').disabled = false;
    }
  });

  function lock() {
    $('modal').close();
    key = null;
    state = null;
    editor = null;
    $('fields').replaceChildren();
    $('money-preview').replaceChildren();
    $('money-preview').hidden = true;
    for (const id of ['content', 'location-name', 'country-name', 'trip-heading', 'trip-dates']) {
      $(id).replaceChildren();
    }
    $('status').textContent = '';
    $('app').hidden = true;
    $('gate').hidden = false;
    $('password').type = 'password';
    $('password').focus();
    window.scrollTo(0, 0);
  }

  async function backup() {
    const record = await encrypt(state);
    const snapshot = document.documentElement.cloneNode(true);
    snapshot.querySelector('#trip-payload').textContent = JSON.stringify({ ...record, copy: newId() });
    for (const id of ['nav', 'content', 'fields', 'money-preview', 'location-name', 'country-name', 'trip-heading', 'trip-dates', 'status', 'error', 'gate-error', 'editor-title']) {
      snapshot.querySelector('#' + id).replaceChildren();
    }
    snapshot.querySelector('#modal').removeAttribute('open');
    snapshot.querySelector('#money-preview').hidden = true;
    snapshot.querySelector('#gate').hidden = false;
    snapshot.querySelector('#app').hidden = true;
    snapshot.querySelector('#password').removeAttribute('value');
    const url = URL.createObjectURL(new Blob(['<!doctype html>\n', snapshot.outerHTML], { type: 'text/html' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'index.html';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    $('status').textContent = '현재 기록을 담은 잠금 백업을 내려받았어요.';
  }

  document.body.addEventListener('click', async (event) => {
    const target = event.target.closest('[data-action]');
    if (!target || !state || saving) return;
    const { action, id } = target.dataset;
    try {
      switch (action) {
        case 'page':
          page = id;
          render();
          $('content').scrollIntoView({ block: 'nearest' });
          break;
        case 'day':
          day = Number(id);
          render();
          document.querySelector('.days .on').focus();
          break;
        case 'lock': lock(); break;
        case 'backup': await backup(); break;
        case 'newEvent':
        case 'editEvent': openEditor('event', id); break;
        case 'newExpense':
        case 'editExpense': openEditor('expense', id); break;
        case 'editBudget': openEditor('budget'); break;
        case 'toggleEvent': {
          target.disabled = true;
          const next = structuredClone(state);
          const current = next.days[day][3].find((entry) => entry.id === id);
          current.done = !current.done;
          await commit(next);
          render();
          document.querySelector(`[data-action="toggleEvent"][data-id="${id}"]`)?.focus();
          break;
        }
      }
    } catch (error) {
      $('status').textContent = error.message;
      target.disabled = false;
    }
  });

  $('close').addEventListener('click', () => $('modal').close());
  $('modal').addEventListener('cancel', (event) => {
    if ($('save').disabled) event.preventDefault();
  });
  $('show-password').addEventListener('click', () => {
    const reveal = $('password').type === 'password';
    $('password').type = reveal ? 'text' : 'password';
    $('show-password').setAttribute('aria-label', reveal ? '접속 코드 숨기기' : '접속 코드 표시');
    $('password').focus();
  });

  $('unlock').addEventListener('submit', async (event) => {
    event.preventDefault();
    $('gate-error').textContent = '';
    $('open-book').disabled = true;
    $('open-book').textContent = '수첩 여는 중…';
    try {
      if (!globalThis.crypto?.subtle) throw new Error('secure-context');
      const accessKey = await getKey($('password').value.trim());
      const initial = await decrypt(payload, accessKey);
      canStore = true;
      diskSnapshot = null;
      try {
        diskSnapshot = localStorage.getItem(cacheKey);
      } catch {
        canStore = false;
      }
      state = initial;
      if (diskSnapshot) {
        try {
          state = await decrypt(JSON.parse(diskSnapshot), accessKey);
        } catch {
          canStore = false;
        }
      }
      key = accessKey;
      render();
      if (!canStore) showSaveStatus();
      $('password').value = '';
      $('gate').hidden = true;
      $('app').hidden = false;
      $('nav').querySelector('.on').focus();
    } catch (error) {
      $('gate-error').textContent = error.message === 'secure-context'
        ? '미리보기에서는 암호를 풀 수 없어요. 파일을 내려받아 Chrome이나 Edge에서 직접 열거나, GitHub Pages의 HTTPS 주소로 열어주세요.'
        : error.name === 'OperationError' ? '접속 코드를 다시 확인해 주세요.' : '저장된 수첩을 열 수 없어요.';
    } finally {
      $('open-book').textContent = '수첩 열기';
      $('open-book').disabled = false;
    }
  });

  $('gate-hint').textContent = '접속 코드를 입력해 수첩을 열어주세요.';
  $('open-book').disabled = false;
})();
  </script>
</body>
</html>
